# ─────────────────────────────────────────────────────────────────
# Generated by Saber v0.1.0 on 2026-07-18 for llvm-project
#
#   Languages:    javascript/typescript, python, c/c++
#   Build:        python
#   Namespace:    endor-solutions-ypulse.github-ci.saber-e2e
#   Auth:         GitHub OIDC (keyless)
#   PR behavior:  comment on PR (non-blocking)
#   PR scan mode: quick
#
# Regenerate this file with `saber scan repo` (point at this repo's path).
# Hand-edits will be overwritten on the next regeneration.
# ─────────────────────────────────────────────────────────────────
#
# Saber split one or more scan units to fit standard runner memory:
#   • python: 8 shards (llvm, mlir, clang, third-party, .ci, flang, libcxx, root)
#     Saber split the python scan into multiple jobs because this repo has 21
#     python root manifests — a single full-reachability scan exceeds the
#     ubuntu-latest runner memory budget. Each shard scans one top-level
#     subtree with full reachability preserved.
#
name: Endor Labs Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      python-llvm: ${{ steps.filter.outputs.python-llvm }}
      python-mlir: ${{ steps.filter.outputs.python-mlir }}
      python-clang: ${{ steps.filter.outputs.python-clang }}
      python-third-party: ${{ steps.filter.outputs.python-third-party }}
      python-ci: ${{ steps.filter.outputs.python-ci }}
      python-flang: ${{ steps.filter.outputs.python-flang }}
      python-libcxx: ${{ steps.filter.outputs.python-libcxx }}
      python-root: ${{ steps.filter.outputs.python-root }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            javascript-typescript:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
            python-llvm:
              - llvm/**/'**/requirements.txt'
              - llvm/**/'**/pyproject.toml'
              - llvm/**/'**/poetry.lock'
              - llvm/**/'**/setup.py'
              - llvm/**/'**/setup.cfg'
              - llvm/**/'**/Pipfile'
              - llvm/**/'**/Pipfile.lock'
              - llvm/**/'**/pdm.lock'
              - llvm/**/'**/uv.lock'
              - llvm/**/'**/*.py'
            python-mlir:
              - mlir/**/'**/requirements.txt'
              - mlir/**/'**/pyproject.toml'
              - mlir/**/'**/poetry.lock'
              - mlir/**/'**/setup.py'
              - mlir/**/'**/setup.cfg'
              - mlir/**/'**/Pipfile'
              - mlir/**/'**/Pipfile.lock'
              - mlir/**/'**/pdm.lock'
              - mlir/**/'**/uv.lock'
              - mlir/**/'**/*.py'
            python-clang:
              - clang/**/'**/requirements.txt'
              - clang/**/'**/pyproject.toml'
              - clang/**/'**/poetry.lock'
              - clang/**/'**/setup.py'
              - clang/**/'**/setup.cfg'
              - clang/**/'**/Pipfile'
              - clang/**/'**/Pipfile.lock'
              - clang/**/'**/pdm.lock'
              - clang/**/'**/uv.lock'
              - clang/**/'**/*.py'
            python-third-party:
              - third-party/**/'**/requirements.txt'
              - third-party/**/'**/pyproject.toml'
              - third-party/**/'**/poetry.lock'
              - third-party/**/'**/setup.py'
              - third-party/**/'**/setup.cfg'
              - third-party/**/'**/Pipfile'
              - third-party/**/'**/Pipfile.lock'
              - third-party/**/'**/pdm.lock'
              - third-party/**/'**/uv.lock'
              - third-party/**/'**/*.py'
            python-ci:
              - .ci/**/'**/requirements.txt'
              - .ci/**/'**/pyproject.toml'
              - .ci/**/'**/poetry.lock'
              - .ci/**/'**/setup.py'
              - .ci/**/'**/setup.cfg'
              - .ci/**/'**/Pipfile'
              - .ci/**/'**/Pipfile.lock'
              - .ci/**/'**/pdm.lock'
              - .ci/**/'**/uv.lock'
              - .ci/**/'**/*.py'
            python-flang:
              - flang/**/'**/requirements.txt'
              - flang/**/'**/pyproject.toml'
              - flang/**/'**/poetry.lock'
              - flang/**/'**/setup.py'
              - flang/**/'**/setup.cfg'
              - flang/**/'**/Pipfile'
              - flang/**/'**/Pipfile.lock'
              - flang/**/'**/pdm.lock'
              - flang/**/'**/uv.lock'
              - flang/**/'**/*.py'
            python-libcxx:
              - libcxx/**/'**/requirements.txt'
              - libcxx/**/'**/pyproject.toml'
              - libcxx/**/'**/poetry.lock'
              - libcxx/**/'**/setup.py'
              - libcxx/**/'**/setup.cfg'
              - libcxx/**/'**/Pipfile'
              - libcxx/**/'**/Pipfile.lock'
              - libcxx/**/'**/pdm.lock'
              - libcxx/**/'**/uv.lock'
              - libcxx/**/'**/*.py'
            python-root:
              - '**/requirements.txt'
              - '**/pyproject.toml'
              - '**/poetry.lock'
              - '**/setup.py'
              - '**/setup.cfg'
              - '**/Pipfile'
              - '**/Pipfile.lock'
